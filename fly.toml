# LifeOS — production on Fly.io (stable HTTPS, no rotating tunnel)
#
# One-time:
#   brew install flyctl
#   fly auth login
#   fly apps create lifeos
#   fly postgres create --name lifeos-db --region ams
#   fly postgres attach lifeos-db -a lifeos
#   # then GitHub Actions → Deploy, or: ./scripts/ci-deploy-fly.sh
#
# App URL: https://<app-name>.fly.dev  → Mini App …/app/ , webhook …/webhook/telegram

app = 'lifeos'
primary_region = 'ams'

[build]
  dockerfile = 'deployments/Dockerfile'

[env]
  LIFEOS_HTTP_ADDR = ':8080'
  LIFEOS_STATIC_DIR = '/app/web'
  LIFEOS_MIGRATIONS_DIR = '/app/migrations'
  LIFEOS_TELEGRAM_MODE = 'webhook'
  LIFEOS_LOG_FORMAT = 'text'
  LIFEOS_LOG_LEVEL = 'info'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[deploy]
  release_command = '/app/lifeos migrate up'
