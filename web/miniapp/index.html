<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <title>LifeOS</title>
    <script>
      window.__LIFEOS_T = []
      window.__LIFEOS_MARK = function (name) {
        var rows = window.__LIFEOS_T
        for (var i = 0; i < rows.length; i++) if (rows[i][0] === name) return
        var now = window.performance && performance.now ? performance.now() : 0
        rows.push([name, Math.round(now)])
        try { performance.mark('lifeos:' + name) } catch (e) {}
      }
      window.__LIFEOS_MARK('html')
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }
      #boot {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 2rem;
        color: #94a3b8;
        text-align: center;
      }
      .boot-spin {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(148, 163, 184, 0.35);
        border-top-color: #22c55e;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      .boot-retry {
        margin-top: 8px;
        border: none;
        border-radius: 16px;
        background: #22c55e;
        color: #fff;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 500;
      }
    </style>
    <!-- Same-origin SDK (public/telegram-web-app.js). A blocking script from
         telegram.org hangs the WebView when that host is slow or blocked.
         async so a slow SDK cannot stall the app module. Do NOT also import @twa-dev/sdk. -->
    <link rel="preload" href="%BASE_URL%telegram-web-app.js?v=20261007" as="script" />
    <!-- async, not defer: a deferred SDK blocks the app module until the
         whole file executes. If that request stalls, the Mini App never starts. -->
    <script async src="%BASE_URL%telegram-web-app.js?v=20261007" onload="window.__LIFEOS_MARK&&window.__LIFEOS_MARK('sdk')" onerror="window.__LIFEOS_TG_SDK_FAILED=1;window.__LIFEOS_MARK&&window.__LIFEOS_MARK('sdk-error')"></script>
    <!-- Capture launch payload BEFORE the React module boots. Reload() drops
         #tgWebAppData; sessionStorage keeps initData for this Mini App sheet. -->
    <script>
      (function () {
        var KEY = 'lifeos.tg.initData.v1'
        function readWebApp() {
          try {
            return (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) || ''
          } catch (e) {
            return ''
          }
        }
        function readHash() {
          try {
            var h = location.hash || ''
            if (h.charAt(0) === '#') h = h.slice(1)
            var key = 'tgWebAppData='
            var i = h.indexOf(key)
            if (i < 0) return ''
            var rest = h.slice(i + key.length)
            var next = rest.search(/&tgWebApp[A-Za-z]+=/)
            if (next >= 0) rest = rest.slice(0, next)
            return decodeURIComponent(rest.replace(/\+/g, '%20'))
          } catch (e) {
            return ''
          }
        }
        function readStored() {
          try {
            return sessionStorage.getItem(KEY) || ''
          } catch (e) {
            return ''
          }
        }
        // Prefer live WebApp.initData; never let a stale storage copy win.
        var raw = readWebApp() || readHash() || readStored()
        if (raw) {
          window.__LIFEOS_INIT_DATA__ = raw
          try {
            sessionStorage.setItem(KEY, raw)
          } catch (e) {}
        }
        window.__LIFEOS_MARK && window.__LIFEOS_MARK(raw ? 'initdata' : 'initdata-empty')
      })()
    </script>
    <!-- Registered before Vite injects the module into <head>, so a failed
         chunk is caught even if the network error beats </body>. -->
    <script>
      (function () {
        var shown = false
        function showBootError() {
          if (shown) return
          var root = document.getElementById('root')
          if (!root || root.getAttribute('data-booted') === '1') return
          shown = true
          root.innerHTML =
            '<div id="boot"><p style="margin:0;color:#f8fafc;font-size:18px;font-weight:500">Не удалось загрузить</p>' +
            '<p style="margin:8px 0 0;max-width:280px;font-size:14px">Скрипт Mini App не стартовал. Проверь сеть и открой ещё раз.</p>' +
            '<button type="button" class="boot-retry" onclick="location.reload()">Повторить</button></div>'
        }
        window.__LIFEOS_BOOT_OK__ = function () {
          var root = document.getElementById('root')
          if (root) root.setAttribute('data-booted', '1')
        }
        window.__LIFEOS_BOOT_FAIL__ = showBootError
        window.addEventListener('error', function (ev) {
          var t = ev.target
          if (!t || t.tagName !== 'SCRIPT') return
          var src = t.src || ''
          if (src.indexOf('telegram-web-app') >= 0 || src.indexOf('telegram.org') >= 0) return
          showBootError()
        }, true)
        window.setTimeout(showBootError, 15000)
      })()
    </script>
  </head>
  <body>
    <div id="root"><div id="boot"><div class="boot-spin"></div><div>Загрузка LifeOS…</div></div></div>
    <!-- Dismiss Telegram's own loader before the SDK or the app bundle run. -->
    <script>
      (function () {
        function post(eventType) {
          try {
            var payload = JSON.stringify({ eventType: eventType, eventData: '' })
            if (window.TelegramWebviewProxy && window.TelegramWebviewProxy.postEvent) {
              window.TelegramWebviewProxy.postEvent(eventType, JSON.stringify(''))
              return
            }
            if (window.external && typeof window.external.notify === 'function') {
              window.external.notify(payload)
              return
            }
            if (window.parent && window.parent !== window) {
              window.parent.postMessage(payload, '*')
            }
          } catch (e) {}
        }
        post('web_app_ready')
        post('web_app_expand')
        window.__LIFEOS_MARK && window.__LIFEOS_MARK('tg-ready')
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
