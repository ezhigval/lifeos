<!doctype html>
<html lang="ru">
  <head>
    <script>
      /* Tell Telegram to drop its cover before any file download.
         The cover stays up until web_app_ready, and the full WebApp
         script is large enough to stall that on a slow LTE link. */
      (function () {
        function signal() {
          try {
            var payload = JSON.stringify('')
            if (window.TelegramWebviewProxy && TelegramWebviewProxy.postEvent) {
              TelegramWebviewProxy.postEvent('web_app_ready', payload)
              TelegramWebviewProxy.postEvent('web_app_expand', payload)
              return true
            }
            if (window.external && typeof window.external.notify === 'function') {
              window.external.notify(JSON.stringify({eventType: 'web_app_ready', eventData: ''}))
              window.external.notify(JSON.stringify({eventType: 'web_app_expand', eventData: ''}))
              return true
            }
            if (window.parent && window.parent !== window) {
              window.parent.postMessage(JSON.stringify({eventType: 'web_app_ready', eventData: ''}), '*')
              window.parent.postMessage(JSON.stringify({eventType: 'web_app_expand', eventData: ''}), '*')
              return true
            }
          } catch (e) {}
          return false
        }
        if (!signal()) {
          var tries = 0
          var timer = setInterval(function () {
            tries++
            if (signal() || tries > 40) clearInterval(timer)
          }, 50)
        }
      })()
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <title>LifeOS</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }
      #boot {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        color: #e2e8f0;
        font-size: 17px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">Загрузка LifeOS…</div></div>
    <!-- Same-origin copy of https://telegram.org/js/telegram-web-app.js.
         Kept after the boot line: a blocking script in head paints nothing
         until the file arrives, which is the gray screen on a slow LTE link.
         Do NOT also import @twa-dev/sdk — a second copy blanks many WebViews. -->
    <script src="/app/telegram-web-app.js"></script>
    <!-- Capture launch payload BEFORE the React module boots. Reload() drops
         #tgWebAppData; sessionStorage keeps initData for this Mini App sheet. -->
    <script>
      (function () {
        try {
          var wa = window.Telegram && window.Telegram.WebApp
          if (wa) {
            if (wa.ready) wa.ready()
            if (wa.expand) wa.expand()
          }
        } catch (e) {}
        var KEY = 'lifeos.tg.initData.v1'
        function readWebApp() {
          try {
            return (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) || ''
          } catch (e) {
            return ''
          }
        }
        function readHash() {
          try {
            var h = location.hash || ''
            if (h.charAt(0) === '#') h = h.slice(1)
            var key = 'tgWebAppData='
            var i = h.indexOf(key)
            if (i < 0) return ''
            var rest = h.slice(i + key.length)
            var next = rest.search(/&tgWebApp[A-Za-z]+=/)
            if (next >= 0) rest = rest.slice(0, next)
            return decodeURIComponent(rest.replace(/\+/g, '%20'))
          } catch (e) {
            return ''
          }
        }
        function readStored() {
          try {
            return sessionStorage.getItem(KEY) || ''
          } catch (e) {
            return ''
          }
        }
        // Prefer live WebApp.initData; never let a stale storage copy win.
        var raw = readWebApp() || readHash() || readStored()
        if (raw) {
          window.__LIFEOS_INIT_DATA__ = raw
          try {
            sessionStorage.setItem(KEY, raw)
          } catch (e) {}
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
