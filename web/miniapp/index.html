<!doctype html>
<html lang="ru">
  <head>
    <script>
      /* Tell Telegram to drop its cover before any file download.
         The cover stays up until web_app_ready, and the full WebApp
         script is large enough to stall that on a slow LTE link. */
      (function () {
        function signal() {
          try {
            var payload = JSON.stringify('')
            if (window.TelegramWebviewProxy && TelegramWebviewProxy.postEvent) {
              TelegramWebviewProxy.postEvent('web_app_ready', payload)
              TelegramWebviewProxy.postEvent('web_app_expand', payload)
              return true
            }
            if (window.external && typeof window.external.notify === 'function') {
              window.external.notify(JSON.stringify({eventType: 'web_app_ready', eventData: ''}))
              window.external.notify(JSON.stringify({eventType: 'web_app_expand', eventData: ''}))
              return true
            }
            if (window.parent && window.parent !== window) {
              window.parent.postMessage(JSON.stringify({eventType: 'web_app_ready', eventData: ''}), '*')
              window.parent.postMessage(JSON.stringify({eventType: 'web_app_expand', eventData: ''}), '*')
              return true
            }
          } catch (e) {}
          return false
        }
        if (!signal()) {
          var tries = 0
          var timer = setInterval(function () {
            tries++
            if (signal() || tries > 40) clearInterval(timer)
          }, 50)
        }
      })()
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <title>LifeOS</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }
      #boot {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        color: #e2e8f0;
        font-size: 17px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">Загрузка LifeOS…</div></div>
    <!-- Hash only. telegram-web-app.js is not loaded yet, and a blocking
         tag in front of the module keeps this line up forever if that file
         stalls inside TelegramWebviewProxy. -->
    <script>
      (function () {
        var KEY = 'lifeos.tg.initData.v1'
        function readHash() {
          try {
            var h = location.hash || ''
            if (h.charAt(0) === '#') h = h.slice(1)
            var key = 'tgWebAppData='
            var i = h.indexOf(key)
            if (i < 0) return ''
            var rest = h.slice(i + key.length)
            var next = rest.search(/&tgWebApp[A-Za-z]+=/)
            if (next >= 0) rest = rest.slice(0, next)
            return decodeURIComponent(rest.replace(/\+/g, '%20'))
          } catch (e) {
            return ''
          }
        }
        function readStored() {
          try {
            return sessionStorage.getItem(KEY) || ''
          } catch (e) {
            return ''
          }
        }
        var raw = readHash() || readStored()
        if (raw) {
          window.__LIFEOS_INIT_DATA__ = raw
          try {
            sessionStorage.setItem(KEY, raw)
          } catch (e) {}
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /* telegram-web-app.js is injected by main.tsx after React mounts. */
      function lifeosBoot(msg) {
        var boot = document.getElementById('boot')
        if (boot) boot.textContent = msg
      }
      var tags = document.getElementsByTagName('script')
      for (var i = 0; i < tags.length; i++) {
        var src = tags[i].getAttribute('src') || ''
        if (src.indexOf('/assets/') >= 0 || src.indexOf('/src/main') >= 0) {
          tags[i].addEventListener('error', function () {
            lifeosBoot('Не удалось загрузить приложение')
          })
        }
      }
      window.addEventListener('error', function (e) {
        if (e && e.message) lifeosBoot('Ошибка: ' + e.message)
      })
      setTimeout(function () {
        if (!document.getElementById('boot')) return
        var info = window.__LIFEOS_LOAD || 'не стартовал'
        try {
          var entries = performance.getEntriesByType('resource')
          var jsCount = 0
          var last = ''
          for (var j = 0; j < entries.length; j++) {
            var n = entries[j]
            if (n.name.indexOf('.js') < 0) continue
            if (n.name.indexOf('/assets/') < 0 && n.name.indexOf('/src/main') < 0) continue
            jsCount++
            last = n.name.split('/').pop().split('?')[0]
          }
          if (jsCount) info = info + ' ' + jsCount + ' ' + last
        } catch (e) {}
        lifeosBoot((window.__LIFEOS_JS ? 'Скрипт завис' : 'Скрипт не запустился') + ' (' + info + ')')
      }, 30000)
    </script>
  </body>
</html>
