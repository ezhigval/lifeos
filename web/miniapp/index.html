<!doctype html>
<html lang="ru">
  <head>
    <script>
      /* Tell Telegram to drop its cover before any file download.
         The cover stays up until web_app_ready, and the full WebApp
         script is large enough to stall that on a slow LTE link. */
      (function () {
        // Native Telegram calls this as soon as we signal ready. The real
        // handler arrives later with telegram-web-app.js; without a stub
        // WebKit throws and our boot screen shows that TypeError.
        if (!window.TelegramGameProxy) {
          window.TelegramGameProxy = { receiveEvent: function () {} }
        }
        if (typeof window.TelegramGameProxy_receiveEvent !== 'function') {
          window.TelegramGameProxy_receiveEvent = function () {}
        }
        function signal() {
          try {
            var payload = JSON.stringify('')
            if (window.TelegramWebviewProxy && TelegramWebviewProxy.postEvent) {
              TelegramWebviewProxy.postEvent('web_app_ready', payload)
              TelegramWebviewProxy.postEvent('web_app_expand', payload)
              return true
            }
            if (window.external && typeof window.external.notify === 'function') {
              window.external.notify(JSON.stringify({eventType: 'web_app_ready', eventData: ''}))
              window.external.notify(JSON.stringify({eventType: 'web_app_expand', eventData: ''}))
              return true
            }
            if (window.parent && window.parent !== window) {
              window.parent.postMessage(JSON.stringify({eventType: 'web_app_ready', eventData: ''}), '*')
              window.parent.postMessage(JSON.stringify({eventType: 'web_app_expand', eventData: ''}), '*')
              return true
            }
          } catch (e) {}
          return false
        }
        if (!signal()) {
          var tries = 0
          var timer = setInterval(function () {
            tries++
            if (signal() || tries > 40) clearInterval(timer)
          }, 50)
        }
      })()
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <title>LifeOS</title>
    <script>
      window.__LIFEOS_T = []
      window.__LIFEOS_MARK = function (name) {
        var rows = window.__LIFEOS_T
        for (var i = 0; i < rows.length; i++) if (rows[i][0] === name) return
        var now = window.performance && performance.now ? performance.now() : 0
        rows.push([name, Math.round(now)])
        try { performance.mark('lifeos:' + name) } catch (e) {}
      }
      window.__LIFEOS_MARK('html')
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }
      #boot {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 2rem;
        color: #e2e8f0;
        font-size: 17px;
        text-align: center;
      }
      .boot-spin {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(148, 163, 184, 0.35);
        border-top-color: #22c55e;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      .boot-retry {
        margin-top: 8px;
        border: none;
        border-radius: 16px;
        background: #22c55e;
        color: #fff;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">Загрузка LifeOS…</div></div>
    <!-- Hash only. telegram-web-app.js is not loaded yet, and a blocking
         tag in front of the module keeps this line up forever if that file
         stalls inside TelegramWebviewProxy. -->
    <script>
      (function () {
        var KEY = 'lifeos.tg.initData.v1'
        function readHash() {
          try {
            var h = location.hash || ''
            if (h.charAt(0) === '#') h = h.slice(1)
            var key = 'tgWebAppData='
            var i = h.indexOf(key)
            if (i < 0) return ''
            var rest = h.slice(i + key.length)
            var next = rest.search(/&tgWebApp[A-Za-z]+=/)
            if (next >= 0) rest = rest.slice(0, next)
            return decodeURIComponent(rest.replace(/\+/g, '%20'))
          } catch (e) {
            return ''
          }
        }
        function readStored() {
          try {
            return sessionStorage.getItem(KEY) || ''
          } catch (e) {
            return ''
          }
        }
        var raw = readHash() || readStored()
        if (raw) {
          window.__LIFEOS_INIT_DATA__ = raw
          try {
            sessionStorage.setItem(KEY, raw)
          } catch (e) {}
        }
        window.__LIFEOS_MARK && window.__LIFEOS_MARK(raw ? 'initdata' : 'initdata-empty')
      })()
    </script>
    <!-- Registered before Vite injects the module into head, so a failed
         chunk is caught even if the network error beats the boot watchdog. -->
    <script>
      (function () {
        var shown = false
        function showBootError() {
          if (shown) return
          var root = document.getElementById('root')
          if (!root || root.getAttribute('data-booted') === '1') return
          shown = true
          root.innerHTML =
            '<div id="boot"><p style="margin:0;color:#f8fafc;font-size:18px;font-weight:500">Не удалось загрузить</p>' +
            '<p style="margin:8px 0 0;max-width:280px;font-size:14px">Скрипт Mini App не стартовал. Проверь сеть и открой ещё раз.</p>' +
            '<button type="button" class="boot-retry" onclick="location.reload()">Повторить</button></div>'
        }
        window.__LIFEOS_BOOT_OK__ = function () {
          var root = document.getElementById('root')
          if (root) root.setAttribute('data-booted', '1')
        }
        window.__LIFEOS_BOOT_FAIL__ = showBootError
        window.addEventListener('error', function (ev) {
          var t = ev.target
          if (!t || t.tagName !== 'SCRIPT') return
          var src = t.src || ''
          if (src.indexOf('telegram-web-app') >= 0 || src.indexOf('telegram.org') >= 0) return
          showBootError()
        }, true)
        window.setTimeout(showBootError, 15000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /* telegram-web-app.js is injected by main.tsx after React mounts. */
      function lifeosBoot(msg) {
        var boot = document.getElementById('boot')
        if (boot) boot.textContent = msg
      }
      var tags = document.getElementsByTagName('script')
      for (var i = 0; i < tags.length; i++) {
        var src = tags[i].getAttribute('src') || ''
        if (src.indexOf('/assets/') >= 0 || src.indexOf('/src/main') >= 0) {
          tags[i].addEventListener('error', function () {
            lifeosBoot('Не удалось загрузить приложение')
          })
        }
      }
      window.addEventListener('error', function (e) {
        var msg = e && e.message ? String(e.message) : ''
        if (!msg || msg.indexOf('TelegramGameProxy') >= 0) return
        lifeosBoot('Ошибка: ' + msg)
      })
      setTimeout(function () {
        if (!document.getElementById('boot')) return
        var info = window.__LIFEOS_LOAD || 'не стартовал'
        try {
          var entries = performance.getEntriesByType('resource')
          var jsCount = 0
          var last = ''
          for (var j = 0; j < entries.length; j++) {
            var n = entries[j]
            if (n.name.indexOf('.js') < 0) continue
            if (n.name.indexOf('/assets/') < 0 && n.name.indexOf('/src/main') < 0) continue
            jsCount++
            last = n.name.split('/').pop().split('?')[0]
          }
          if (jsCount) info = info + ' ' + jsCount + ' ' + last
        } catch (e) {}
        lifeosBoot((window.__LIFEOS_JS ? 'Скрипт завис' : 'Скрипт не запустился') + ' (' + info + ')')
      }, 60000)
    </script>
  </body>
</html>
