<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <title>LifeOS</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }
      #boot {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        color: #94a3b8;
        text-align: center;
      }
    </style>
    <!-- Official Telegram script only. Do NOT also import @twa-dev/sdk —
         it embeds another copy and double-loading blanks many WebViews. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Capture launch payload BEFORE the React module boots. Reload() drops
         #tgWebAppData; sessionStorage keeps initData for this Mini App sheet. -->
    <script>
      (function () {
        var KEY = 'lifeos.tg.initData.v1'
        function readHash() {
          try {
            var h = location.hash || ''
            if (h.charAt(0) === '#') h = h.slice(1)
            if (!h || h.indexOf('=') < 0) return ''
            return new URLSearchParams(h).get('tgWebAppData') || ''
          } catch (e) {
            return ''
          }
        }
        function readWebApp() {
          try {
            return (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) || ''
          } catch (e) {
            return ''
          }
        }
        function readStored() {
          try {
            return sessionStorage.getItem(KEY) || ''
          } catch (e) {
            return ''
          }
        }
        var raw = readWebApp() || readHash() || readStored()
        if (raw) {
          window.__LIFEOS_INIT_DATA__ = raw
          try {
            sessionStorage.setItem(KEY, raw)
          } catch (e) {}
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"><div id="boot">Загрузка LifeOS…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
