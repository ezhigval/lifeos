name: Desktop release

# macOS runner only. The .app command is `bash scripts/build-mac-app.sh`.
# Windows has no runner in this workflow. The windowed zip is
# `bash scripts/build-win-desktop.sh` (lifeos-desktop.exe + install.bat).

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/miniapp/package-lock.json

      - name: Build LifeOS.app
        env:
          LIFEOS_DESKTOP_VERSION: ${{ github.ref_name }}
        run: bash scripts/build-mac-app.sh

      - name: Write GitHub Releases manifest
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v}"
          case "$version" in
            ''|*[!0-9.]*) echo "bad version: $version" >&2; exit 1 ;;
          esac
          sha=$(shasum -a 256 dist/LifeOS-mac.zip | awk '{print $1}')
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/LifeOS-mac.zip"
          python3 - "$version" "$url" "$sha" <<'PY'
          import json, sys
          version, url, sha = sys.argv[1:]
          with open("dist/latest.json", "w") as fh:
              json.dump({"version": version, "url": url, "sha256": sha}, fh)
              fh.write("\n")
          PY

      - uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          files: |
            dist/LifeOS-mac.zip
            dist/latest.json
          fail_on_unmatched_files: true
          body: |
            LifeOS для Mac, Apple Silicon и Intel.

            Экраны на всю ширину окна. При каждом запуске приложение читает https://github.com/ezhigval/lifeos/releases/latest/download/latest.json и, если эта сборка новее, скачивает zip с той же страницы Releases и открывается заново. ВМ эти файлы не отдаёт.

            Первый запуск: правый клик по LifeOS.app → Открыть. Подпись без сертификата Apple, поэтому двойной клик система блокирует.

            Вход — ник Telegram и код из бота.
