name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos
          POSTGRES_DB: lifeos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifeos -d lifeos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      LIFEOS_DATABASE_URL: postgres://lifeos:lifeos@localhost:5432/lifeos?sslmode=disable
      LIFEOS_LOG_FORMAT: text
      GOTOOLCHAIN: local

    steps:
      - uses: actions/checkout@v5

      - name: Secret scan
        run: bash scripts/check-no-secrets.sh

      - name: Deploy script
        run: bash deployments/vm-pull-deploy_test.sh

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.4.0

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: OpenAPI route parity
        run: make openapi-check

      - name: Vet
        run: go vet ./...

      - name: Test
        run: |
          go test ./... -count=1 -coverprofile=coverage.out
          go tool cover -func=coverage.out | tee cover.txt
          grep -E 'tasks/(domain|app)|projects/domain|ai/rulebased|finance/(domain|app)|spheres/domain|identity/domain' cover.txt

      - name: Coverage gate
        run: make coverage-check

      - name: Migrate up
        run: go run ./cmd/lifeos migrate up

      - name: Integration test
        run: go test ./internal/transport/http/api/... ./e2e/... -count=1 -tags=integration

      - name: Build
        run: go build -o bin/lifeos ./cmd/lifeos

      - name: Migrate status
        run: go run ./cmd/lifeos migrate status

  # The VM cannot build this image: its network blocks the Alpine package CDN.
  # Pull requests build and smoke the image. Publish only from main, so a
  # draft does not move the vm-image prerelease or the :main tag.
  image:
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: |
          docker build --platform linux/amd64 \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            -f deployments/Dockerfile -t lifeos-app:deploy .

      - name: Smoke
        run: |
          docker run --rm --entrypoint /app/lifeos lifeos-app:deploy version
          docker run --rm --entrypoint /bin/sh lifeos-app:deploy -c 'test -x /app/lifeos && test -d /app/migrations && grep -q __LIFEOS_MARK /app/web/index.html'

      - name: Push GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          docker tag lifeos-app:deploy "ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
          docker tag lifeos-app:deploy "ghcr.io/${{ github.repository }}:main"
          docker push "ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
          docker push "ghcr.io/${{ github.repository }}:main"
          # A package linked to a public repo can still start private.
          # The release asset below stays downloadable either way.
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/lifeos/visibility" \
            -f visibility=public \
            || echo "GHCR visibility unchanged; the VM can still load the release asset"

      - name: Pack release asset
        run: |
          docker save lifeos-app:deploy | gzip -1 > "lifeos-${{ github.sha }}.tar.gz"
          docker rmi lifeos-app:deploy
          docker load -i "lifeos-${{ github.sha }}.tar.gz"
          docker image inspect lifeos-app:deploy >/dev/null

      - name: Publish prerelease asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: vm-image
          target_commitish: ${{ github.sha }}
          name: VM image
          prerelease: true
          make_latest: "false"
          fail_on_unmatched_files: true
          files: lifeos-${{ github.sha }}.tar.gz
          body: |
            Образ для ВМ, коммит ${{ github.sha }}.
            Это не релиз desktop. Latest остаётся на теге desktop-v*.

      - name: Keep the two newest image assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/vm-image" --jq '.assets | sort_by(.created_at) | .[] | [.id, .name] | @tsv' |
            awk -F '\t' 'BEGIN { keep = 2 } $2 ~ /^lifeos-[0-9a-f]{40}\.tar\.gz$/ { ids[++n] = $1 } END { for (i = 1; i <= n - keep; i++) print ids[i] }' |
            while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/${id}"
            done
