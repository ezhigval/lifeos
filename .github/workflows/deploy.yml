name: Deploy

# GitHub Actions = CI/CD runner, not 24/7 hosting.
# This workflow deploys LifeOS to Fly.io (always-on HTTPS + webhook).
#
# One-time setup:
#   1) fly auth login && fly apps create lifeos (or use existing)
#   2) fly postgres create / attach → DATABASE_URL on the app
#   3) Repo → Settings → Secrets and variables → Actions:
#        FLY_API_TOKEN
#        TELEGRAM_BOT_TOKEN
#        LIFEOS_JWT_SECRET
#        LIFEOS_API_KEY
#        LIFEOS_TELEGRAM_WEBHOOK_SECRET
#        (optional) FLY_APP=lifeos
#        (optional) LIFEOS_SEED_TELEGRAM_ID
#   4) Actions → Deploy → Run workflow
#
# Docs: docs/ops/PRODUCTION.md

on:
  workflow_dispatch:
    inputs:
      app:
        description: Fly app name
        required: false
        default: lifeos
      wire_telegram:
        description: Set Telegram webhook + Mini App menu after deploy
        type: boolean
        default: true
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/ci.yml'

concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ inputs.app || secrets.FLY_APP || 'lifeos' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      LIFEOS_JWT_SECRET: ${{ secrets.LIFEOS_JWT_SECRET }}
      LIFEOS_API_KEY: ${{ secrets.LIFEOS_API_KEY }}
      LIFEOS_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.LIFEOS_TELEGRAM_WEBHOOK_SECRET }}
      LIFEOS_SEED_TELEGRAM_ID: ${{ secrets.LIFEOS_SEED_TELEGRAM_ID }}
      LIFEOS_SEED_TIMEZONE: Europe/Moscow
      LIFEOS_NOTIFY_CHAT_ID: ${{ secrets.LIFEOS_SEED_TELEGRAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Require secrets
        run: |
          missing=
          for k in FLY_API_TOKEN TELEGRAM_BOT_TOKEN LIFEOS_JWT_SECRET LIFEOS_API_KEY LIFEOS_TELEGRAM_WEBHOOK_SECRET; do
            if [ -z "${!k}" ]; then
              missing="$missing $k"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing GitHub Actions secrets:$missing" >&2
            echo "Add them under Settings → Secrets and variables → Actions." >&2
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io + wire Telegram
        run: ./scripts/ci-deploy-fly.sh
        env:
          WIRE_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && inputs.wire_telegram || true }}
