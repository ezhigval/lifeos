openapi: 3.1.0
info:
  title: LifeOS API
  version: 0.2.0
  description: |
    REST surface for LifeOS. Auth: JWT Bearer after API key or Telegram Mini App initData.
    Source of truth for route list: `internal/transport/http/api/router.go`.
paths:
  /api/v1/auth/token:
    post:
      summary: Issue JWT by Telegram ID
      parameters:
        - in: header
          name: X-API-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [telegram_id]
              properties:
                telegram_id:
                  type: integer
                  format: int64
      responses:
        '200':
          description: Access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid API key
  /api/v1/auth/telegram-webapp:
    post:
      summary: Issue JWT from Telegram Mini App initData
      description: |
        Validates `window.Telegram.WebApp.initData` using the bot token
        (HMAC-SHA256 per Telegram WebApp docs), upserts the user, and returns a JWT.
        `auth_date` must be within JWT TTL (default 24h).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [init_data]
              properties:
                init_data:
                  type: string
                  description: Raw query-string from Telegram.WebApp.initData
      responses:
        '200':
          description: Access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Missing init_data
        '401':
          description: Invalid or expired init_data
        '503':
          description: Auth or bot token not configured
  /api/v1/tasks/today:
    get:
      summary: List tasks for today
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Task list
  /api/v1/tasks:
    get:
      summary: List open tasks by hashtag
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: tag
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task list filtered by tag
        '400':
          description: Missing or invalid tag
    post:
      summary: Create task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                description:
                  type: string
                priority:
                  type: string
                due_date:
                  type: string
                  format: date
                duration_minutes:
                  type: integer
                  minimum: 1
                tags:
                  type: array
                  items:
                    type: string
                project_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '201':
          description: Created
  /api/v1/tasks/{id}:
    get:
      summary: Get task by id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task
        '404':
          description: Not found
    patch:
      summary: Edit task (partial update)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                  nullable: true
                  description: Explicit null or empty clears description
                clear_description:
                  type: boolean
                priority:
                  type: string
                due_date:
                  type: string
                  format: date
                  nullable: true
                  description: Explicit null or empty clears due_date
                clear_due_date:
                  type: boolean
                duration_minutes:
                  type: integer
                  minimum: 1
                clear_duration:
                  type: boolean
                tags:
                  type: array
                  items:
                    type: string
                project_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Updated
        '404':
          description: Not found
    delete:
      summary: Soft-delete task
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
  /api/v1/tasks/{id}/complete:
    post:
      summary: Complete task
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Completed
  /api/v1/tasks/{id}/cancel:
    post:
      summary: Cancel task
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cancelled
        '404':
          description: Not found
  /api/v1/tasks/{id}/archive:
    post:
      summary: Archive task (soft cancel)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Archived
        '404':
          description: Not found
  /api/v1/tasks/{id}/reschedule:
    post:
      summary: Reschedule task to a new due date
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [due_date]
              properties:
                due_date:
                  type: string
                  format: date
      responses:
        '200':
          description: Rescheduled
        '404':
          description: Not found
  /api/v1/projects/progress:
    get:
      summary: Project progress
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: project_id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Progress
  /api/v1/reviews/morning:
    get:
      summary: Morning review text
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Review
  /api/v1/reviews/evening:
    get:
      summary: Evening review text
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Review
  /api/v1/reviews/weekly:
    get:
      summary: Weekly review text
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Review
  /api/v1/reviews/monthly:
    get:
      summary: Monthly review text
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: previous_month
          schema:
            type: boolean
      responses:
        '200':
          description: Review
  /api/v1/priorities:
    get:
      summary: Top priorities for today
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Priority list
  /api/v1/analytics/summary:
    get:
      summary: Productivity summary for current month
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Summary
  /api/v1/finance/income:
    post:
      summary: Record income
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_cents]
              properties:
                amount_cents:
                  type: integer
                  format: int64
                description:
                  type: string
                currency:
                  type: string
      responses:
        '201':
          description: Recorded
  /api/v1/finance/expense:
    post:
      summary: Record expense
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_cents]
              properties:
                amount_cents:
                  type: integer
                  format: int64
                category:
                  type: string
                currency:
                  type: string
      responses:
        '201':
          description: Recorded
  /api/v1/finance/cash-flow:
    get:
      summary: Monthly cash flow
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cash flow summary
  /api/v1/finance/overview:
    get:
      summary: Finance overview for a calendar month
      description: |
        Period is `YYYY-MM` interpreted in the user's timezone.
        Categories are expense totals for that month with percent of expense_cents (0–100).
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: period
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
            example: '2026-07'
          description: Calendar month key (YYYY-MM)
      responses:
        '200':
          description: Finance overview matching Mini App FinanceOverview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceOverview'
        '400':
          description: Invalid or malformed period
  /api/v1/finance/debts:
    get:
      summary: List open debts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Debt list
    post:
      summary: Create debt
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [creditor, amount_cents]
              properties:
                creditor:
                  type: string
                amount_cents:
                  type: integer
                  format: int64
                due_date:
                  type: string
                  format: date
                  description: Optional repayment deadline (YYYY-MM-DD)
      responses:
        '201':
          description: Created
  /api/v1/finance/debts/{id}/pay:
    post:
      summary: Pay debt
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_cents]
              properties:
                amount_cents:
                  type: integer
                  format: int64
      responses:
        '200':
          description: Updated debt
  /api/v1/habits/today:
    get:
      summary: Habits for today
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Habit list with today completion and streak
          content:
            application/json:
              schema:
                type: object
                required: [habits]
                properties:
                  habits:
                    type: array
                    items:
                      $ref: '#/components/schemas/HabitDay'
  /api/v1/habits:
    post:
      summary: Create habit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
        '400':
          description: Invalid name
  /api/v1/habits/{id}/track:
    post:
      summary: Track habit completion
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tracked
          content:
            application/json:
              schema:
                type: object
                required: [name, streak]
                properties:
                  name:
                    type: string
                  streak:
                    type: integer
        '400':
          description: Invalid habit id
        '404':
          description: Habit not found
  /api/v1/reminders:
    get:
      summary: List pending reminders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reminder list
    post:
      summary: Schedule reminder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, fire_at]
              properties:
                message:
                  type: string
                fire_at:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Scheduled
  /api/v1/reminders/{id}:
    delete:
      summary: Cancel pending reminder
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cancelled reminder
        '404':
          description: Not found
  /api/v1/notes:
    get:
      summary: List or search notes
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: Search notes by body substring (case-insensitive)
        - in: query
          name: tag
          required: false
          schema:
            type: string
          description: Filter notes by tag
      responses:
        '200':
          description: Note list
    post:
      summary: Create note
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Created
  /api/v1/notes/{id}:
    delete:
      summary: Delete note
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deleted note
        '404':
          description: Not found
  /api/v1/career/contacts:
    get:
      summary: List or search career contacts
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
      responses:
        '200':
          description: Contact list
    post:
      summary: Create career contact
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                company:
                  type: string
                role:
                  type: string
                notes:
                  type: string
      responses:
        '201':
          description: Created
  /api/v1/career/contacts/{id}:
    delete:
      summary: Delete career contact
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deleted
        '404':
          description: Not found
  /api/v1/career/skills:
    get:
      summary: List or search career skills
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
      responses:
        '200':
          description: Skill list
    post:
      summary: Create career skill
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                level:
                  type: string
      responses:
        '201':
          description: Created
  /api/v1/career/skills/{id}:
    delete:
      summary: Delete career skill
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deleted
        '404':
          description: Not found
  /api/v1/health/weight:
    get:
      summary: List recent weight logs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Weight history
    post:
      summary: Record weight
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weight_kg]
              properties:
                weight_kg:
                  type: number
                  format: double
      responses:
        '201':
          description: Recorded
  /api/v1/health/weight/latest:
    get:
      summary: Latest weight entry
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Latest weight
        '404':
          description: Not found
  /api/v1/health/steps:
    get:
      summary: List recent step logs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Steps history
    post:
      summary: Record steps
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steps]
              properties:
                steps:
                  type: integer
                  minimum: 1
                  maximum: 200000
      responses:
        '201':
          description: Recorded
  /api/v1/health/steps/latest:
    get:
      summary: Latest steps entry
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Latest steps
        '404':
          description: Not found
  /api/v1/health/sleep:
    get:
      summary: List recent sleep logs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sleep history
    post:
      summary: Record sleep
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                duration_hours:
                  type: number
                  format: double
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 24
                duration_minutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
      responses:
        '201':
          description: Recorded
  /api/v1/health/sleep/latest:
    get:
      summary: Latest sleep entry
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Latest sleep
        '404':
          description: Not found
  /api/v1/calendar/today:
    get:
      summary: Events for today
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Event list
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/CalendarEvent'
  /api/v1/calendar/events:
    post:
      summary: Create calendar event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, starts_at]
              properties:
                title:
                  type: string
                starts_at:
                  type: string
                  format: date-time
                  description: RFC3339 timestamp
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEvent'
        '400':
          description: Invalid title or starts_at
  /api/v1/projects:
    get:
      summary: List active projects
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sphere_id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project list
    post:
      summary: Create project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, sphere_ids]
              properties:
                name:
                  type: string
                sphere_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                outcome:
                  type: string
                target_value:
                  type: string
                unit:
                  type: string
                target_date:
                  type: string
                  format: date
      responses:
        '201':
          description: Created
  /api/v1/projects/{id}/tasks:
    get:
      summary: Tasks in project
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task list
  /api/v1/projects/{id}/archive:
    post:
      summary: Archive project
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Archived
  /api/v1/settings:
    get:
      summary: User settings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
  /api/v1/settings/spheres:
    get:
      summary: List life spheres
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sphere list
          content:
            application/json:
              schema:
                type: object
                required: [spheres]
                properties:
                  spheres:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sphere'
    post:
      summary: Create life sphere
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                sort_order:
                  type: integer
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sphere'
        '400':
          description: Invalid name
  /api/v1/settings/spheres/{id}:
    put:
      summary: Update life sphere
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, sort_order]
              properties:
                name:
                  type: string
                sort_order:
                  type: integer
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sphere'
        '400':
          description: Invalid input
        '404':
          description: Not found
    delete:
      summary: Delete life sphere
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deleted sphere (body returned for Mini App)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sphere'
        '404':
          description: Not found
        '409':
          description: Sphere has linked projects
  /api/v1/settings/morning-review:
    put:
      summary: Update morning review time
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hour, minute]
              properties:
                hour:
                  type: integer
                minute:
                  type: integer
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [morning_review_at]
                properties:
                  morning_review_at:
                    $ref: '#/components/schemas/TimeOfDay'
        '400':
          description: Invalid time
  /api/v1/settings/evening-review:
    put:
      summary: Update evening review time
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hour, minute]
              properties:
                hour:
                  type: integer
                minute:
                  type: integer
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [evening_review_at]
                properties:
                  evening_review_at:
                    $ref: '#/components/schemas/TimeOfDay'
        '400':
          description: Invalid time
  /api/v1/settings/quiet-hours:
    put:
      summary: Update quiet hours
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_hour, start_minute, end_hour, end_minute]
              properties:
                start_hour:
                  type: integer
                start_minute:
                  type: integer
                end_hour:
                  type: integer
                end_minute:
                  type: integer
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [quiet_hours_start, quiet_hours_end]
                properties:
                  quiet_hours_start:
                    $ref: '#/components/schemas/TimeOfDay'
                  quiet_hours_end:
                    $ref: '#/components/schemas/TimeOfDay'
        '400':
          description: Invalid time
components:
  schemas:
    FinanceOverview:
      type: object
      required: [period_label, income_cents, expense_cents, net_cents, currency, categories]
      properties:
        period_label:
          type: string
          description: Russian month name and year (e.g. "июль 2026")
          example: июль 2026
        income_cents:
          type: integer
          format: int64
        expense_cents:
          type: integer
          format: int64
        net_cents:
          type: integer
          format: int64
        currency:
          type: string
          example: RUB
        categories:
          type: array
          items:
            $ref: '#/components/schemas/FinanceCategory'
    FinanceCategory:
      type: object
      required: [name, amount_cents, percent]
      properties:
        name:
          type: string
        amount_cents:
          type: integer
          format: int64
        percent:
          type: number
          format: double
          description: Share of expense_cents (0–100)
        color_hint:
          type: string
          description: Optional color hint for UI
    TokenResponse:
      type: object
      required: [access_token, expires_in, token_type]
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          description: Seconds until JWT expiry
        token_type:
          type: string
          example: Bearer
        telegram_id:
          type: integer
          format: int64
          description: Telegram user id from signed initData.user.id (webapp) or looked-up user (API key)
    Sphere:
      type: object
      required: [id, name, sort_order, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
    Habit:
      type: object
      required: [id, name, frequency]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        frequency:
          type: string
          example: daily
    HabitDay:
      type: object
      required: [id, name, today_completed, streak]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        today_completed:
          type: boolean
        streak:
          type: integer
    CalendarEvent:
      type: object
      required: [id, title, starts_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        starts_at:
          type: string
          format: date-time
          description: RFC3339 UTC
    TimeOfDay:
      type: object
      required: [hour, minute]
      properties:
        hour:
          type: integer
          minimum: 0
          maximum: 23
        minute:
          type: integer
          minimum: 0
          maximum: 59
    UserSettings:
      type: object
      required:
        - morning_review_at
        - evening_review_at
        - weekly_review_at
        - monthly_review_at
        - quiet_hours_start
        - quiet_hours_end
        - language
      properties:
        morning_review_at:
          $ref: '#/components/schemas/TimeOfDay'
        evening_review_at:
          $ref: '#/components/schemas/TimeOfDay'
        weekly_review_at:
          $ref: '#/components/schemas/TimeOfDay'
        monthly_review_at:
          $ref: '#/components/schemas/TimeOfDay'
        quiet_hours_start:
          oneOf:
            - $ref: '#/components/schemas/TimeOfDay'
            - type: 'null'
        quiet_hours_end:
          oneOf:
            - $ref: '#/components/schemas/TimeOfDay'
            - type: 'null'
        language:
          type: string
          example: ru
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
