# Production stack: Postgres + LifeOS + Caddy (Let's Encrypt HTTPS)
#
# Usage:
#   cp deployments/.env.prod.example deployments/.env.prod
#   # edit domain, secrets, bot token
#   docker compose -f deployments/docker-compose.prod.yml --env-file deployments/.env.prod up -d --build
#
# DNS: A/AAAA of LIFEOS_DOMAIN → this VPS public IP (ports 80+443 open).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifeos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lifeos}
    volumes:
      - lifeos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    env_file:
      - .env.prod
    environment:
      LIFEOS_DATABASE_URL: postgres://${POSTGRES_USER:-lifeos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lifeos}?sslmode=disable
      LIFEOS_HTTP_ADDR: ":8080"
      LIFEOS_STATIC_DIR: /app/web
      LIFEOS_MIGRATIONS_DIR: /app/migrations
      LIFEOS_TELEGRAM_MODE: ${LIFEOS_TELEGRAM_MODE:-webhook}
      LIFEOS_MINIAPP_URL: https://${LIFEOS_DOMAIN}/app/
      LIFEOS_TELEGRAM_WEBHOOK_URL: https://${LIFEOS_DOMAIN}/webhook/telegram
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
    # no public ports — only via Caddy

  caddy:
    image: caddy:2.9-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      LIFEOS_DOMAIN: ${LIFEOS_DOMAIN:?set LIFEOS_DOMAIN}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:

volumes:
  lifeos_pg:
  caddy_data:
  caddy_config:
