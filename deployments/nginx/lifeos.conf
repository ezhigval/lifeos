# On-box HTTP proxy for the Yandex VM.
#
# Mini App HTTPS is the named Cloudflare tunnel to 127.0.0.1:8080.
# This server is only :80 (direct IP and local debug). It must not be a
# second compressor or a second cache policy.
#
# Do not listen on 443 here. A port that accepts TCP but cannot finish
# TLS makes clients hang. TLS ends at Cloudflare.

server {
    listen 80 default_server;
    server_name _;

    # The Go server precompresses (.br / .gz) and sets Cache-Control.
    # gzip here would recompress, drop Content-Length, and hide brotli.
    gzip off;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep the client's Accept-Encoding. An empty value forces the
        # 380KB script down the tunnel uncompressed.
        proxy_set_header Accept-Encoding $http_accept_encoding;
        proxy_buffering on;
        proxy_read_timeout 120s;
        # Do not add_header Cache-Control. That replaces the app's
        # no-store (HTML) and immutable (hashed JS/CSS).
    }
}
