version: "2"

run:
  tests: true

linters:
  default: standard
  enable:
    - misspell
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - internal/platform/db
      - scripts$
    rules:
      # Intentionally ignored closes (defer cleanup / best-effort).
      - path: (.+)\.go$
        text: "Error return value of `(.+)\\.Close` is not checked"
        linters:
          - errcheck
      - path: (.+)\.go$
        text: "Error return value of `(.+)\\.Rollback` is not checked"
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - internal/platform/db

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
